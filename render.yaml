# Blueprint opcional do Render. Se preferir, crie o Static Site pelo painel
# (veja o README) e ignore este arquivo.
# Obs.: NÃO adicione "Cross-Origin-Opener-Policy: same-origin" — quebra o login com Google (popup).
services:
  - type: web
    name: briif
    runtime: static
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=3600
